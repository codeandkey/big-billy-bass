[package]
name = "bbb"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.39"
circular-buffer = "0.1.9"
clap = { version = "4.5.27", features = ["derive"] }
dirs = "6.0.0"
libpulse-binding = "2.28.2"
libpulse-simple-binding = "2.28.1"
log = "0.4.22"
notify = "7.0.0"
pretty_env_logger = "0.5.0"
regex = "1.11.1"
rppal = { version = "0.22.1", optional = true }
spin_sleep = "1.3.0"

[features]
gpio = ["dep:rppal"]
